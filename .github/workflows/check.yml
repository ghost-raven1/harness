name: Node 24 cross-platform checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  check:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Среда проверки
        run: |
          CI_LOG_DIR="$RUNNER_TEMP/harness-ci"
          printf 'CI_LOG_DIR=%s\n' "$CI_LOG_DIR" >> "$GITHUB_ENV"
          mkdir -p "$CI_LOG_DIR"
          node -e "console.log(JSON.stringify({node:process.version,platform:process.platform,arch:process.arch},null,2))" | tee "$CI_LOG_DIR/environment.log"
          npm --version | tee -a "$CI_LOG_DIR/environment.log"
      - name: Чистая установка из lockfile
        run: npm ci --include=dev --include=optional --no-audit --no-fund 2>&1 | tee "$CI_LOG_DIR/install.log"
      - name: Форматирование, типы, сборка и тесты
        run: npm run check 2>&1 | tee "$CI_LOG_DIR/check.log"
      - name: Каталог 1 000 и 10 000 задач
        if: runner.os == 'Linux'
        run: |
          npm run benchmark:storage -- 1000 "$CI_LOG_DIR/storage-1000.json" 2>&1 | tee "$CI_LOG_DIR/storage-1000.log"
          npm run benchmark:storage -- 10000 "$CI_LOG_DIR/storage-10000.json" 2>&1 | tee "$CI_LOG_DIR/storage-10000.log"
      - name: Проверка ZIP-поставки в новой папке
        run: |
          collect_release() {
            for file in releases/release-check.log releases/release-install.log releases/release-check.json; do
              if [ -f "$file" ]; then cp "$file" "$CI_LOG_DIR/"; fi
            done
          }
          trap collect_release EXIT
          npm run release:check 2>&1 | tee "$CI_LOG_DIR/release.log"
          cp releases/*-source.zip releases/*-source.zip.sha256 "$CI_LOG_DIR/"
      - name: Первый и повторный запуск POSIX
        if: runner.os != 'Windows'
        run: |
          sh ./start.sh --prepare-only 2>&1 | tee "$CI_LOG_DIR/prepare-first.log"
          sh ./start.sh --prepare-only 2>&1 | tee "$CI_LOG_DIR/prepare-second.log"
          sh ./start.sh --help 2>&1 | tee "$CI_LOG_DIR/launcher-help.log"
      - name: Первый и повторный запуск Windows
        if: runner.os == 'Windows'
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/start-windows.ps1 --prepare-only 2>&1 | tee "$CI_LOG_DIR/prepare-first.log"
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/start-windows.ps1 --prepare-only 2>&1 | tee "$CI_LOG_DIR/prepare-second.log"
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/start-windows.ps1 --help 2>&1 | tee "$CI_LOG_DIR/launcher-help.log"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - name: Зависимости терминального сценария
        if: runner.os == 'Linux'
        run: |
          python -m venv "$RUNNER_TEMP/harness-pty-python"
          "$RUNNER_TEMP/harness-pty-python/bin/python" -m pip install --disable-pip-version-check pyte==0.8.2 2>&1 | tee "$CI_LOG_DIR/pty-install.log"
      - name: Офлайн-проверка CLI в PTY
        if: runner.os == 'Linux'
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p .harness
          rm -f docs/playtest-source-bugs.json .harness/source-bugs-frames.json
          collect_pty() {
            for file in docs/playtest-source-bugs.json .harness/source-bugs-frames.json; do
              if [ -f "$file" ]; then cp "$file" "$CI_LOG_DIR/"; fi
            done
          }
          trap collect_pty EXIT
          "$RUNNER_TEMP/harness-pty-python/bin/python" scripts/playtest-source-bugs.py --node "$(command -v node)" 2>&1 | tee "$CI_LOG_DIR/pty.log"
      - name: Два окна, восстановление и диагностика в PTY 48×24 и 80×24
        if: runner.os == 'Linux'
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          collect_core_pty() {
            if [ -d releases/core-playtest ]; then cp -R releases/core-playtest "$CI_LOG_DIR/"; fi
          }
          trap collect_core_pty EXIT
          "$RUNNER_TEMP/harness-pty-python/bin/python" scripts/playtest-core.py --node "$(command -v node)" 2>&1 | tee "$CI_LOG_DIR/core-pty.log"
      - name: Логи и свежие отчёты
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-ci-${{ matrix.os }}
          path: ${{ runner.temp }}/harness-ci/
          if-no-files-found: warn
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Сборка проверочного образа
        run: |
          CI_LOG_DIR="$RUNNER_TEMP/harness-ci"
          printf 'CI_LOG_DIR=%s\n' "$CI_LOG_DIR" >> "$GITHUB_ENV"
          mkdir -p "$CI_LOG_DIR"
          docker build --progress=plain -f Dockerfile.test -t harness-ci:test . 2>&1 | tee "$CI_LOG_DIR/docker-build.log"
      - name: Проверка образа без внешней сети
        run: docker run --rm --network none harness-ci:test 2>&1 | tee "$CI_LOG_DIR/docker-check.log"
      - name: Логи контейнера
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-ci-docker
          path: ${{ runner.temp }}/harness-ci/
          if-no-files-found: warn
          retention-days: 7
