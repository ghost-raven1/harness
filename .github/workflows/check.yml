name: Node 24 cross-platform checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  check:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Среда проверки
        run: |
          CI_LOG_DIR="$RUNNER_TEMP/harness-ci"
          printf 'CI_LOG_DIR=%s\n' "$CI_LOG_DIR" >> "$GITHUB_ENV"
          mkdir -p "$CI_LOG_DIR"
          node -e "console.log(JSON.stringify({node:process.version,platform:process.platform,arch:process.arch},null,2))" | tee "$CI_LOG_DIR/environment.log"
          npm --version | tee -a "$CI_LOG_DIR/environment.log"
      - name: Чистая установка из lockfile
        run: npm ci --include=dev --include=optional --no-audit --no-fund 2>&1 | tee "$CI_LOG_DIR/install.log"
      - name: Форматирование, типы, сборка и тесты
        run: npm run check 2>&1 | tee "$CI_LOG_DIR/check.log"
      - name: Повторная подготовка и освобождение процессов Windows
        if: runner.os == 'Windows'
        run: |
          for pass in 1 2; do
            npm exec -- vitest run test/bootstrap.test.ts test/preparation-process.test.ts 2>&1 | tee "$CI_LOG_DIR/bootstrap-repeat-$pass.log"
          done
      - name: Каталог 1 000 и 10 000 задач
        if: runner.os == 'Linux'
        run: |
          npm run benchmark:storage -- 1000 "$CI_LOG_DIR/storage-1000.json" 2>&1 | tee "$CI_LOG_DIR/storage-1000.log"
          npm run benchmark:storage -- 10000 "$CI_LOG_DIR/storage-10000.json" 2>&1 | tee "$CI_LOG_DIR/storage-10000.log"
      - name: Каталог 100 и 1 000 проектов без чтения историй
        if: runner.os == 'Linux'
        run: |
          npm run benchmark:projects -- 100 "$CI_LOG_DIR/projects-100.json" 2>&1 | tee "$CI_LOG_DIR/projects-100.log"
          npm run benchmark:projects -- 1000 "$CI_LOG_DIR/projects-1000.json" 2>&1 | tee "$CI_LOG_DIR/projects-1000.log"
      - name: Проверка ZIP-поставки в новой папке
        run: |
          collect_release() {
            for file in releases/release-check.log releases/release-install.log releases/release-check.json; do
              if [ -f "$file" ]; then cp "$file" "$CI_LOG_DIR/"; fi
            done
          }
          trap collect_release EXIT
          npm run release:check 2>&1 | tee "$CI_LOG_DIR/release.log"
          cp releases/*-source.zip releases/*-source.zip.sha256 "$CI_LOG_DIR/"
      - name: Первый и повторный запуск POSIX
        if: runner.os != 'Windows'
        run: |
          sh ./start.sh --prepare-only 2>&1 | tee "$CI_LOG_DIR/prepare-first.log"
          sh ./start.sh --prepare-only 2>&1 | tee "$CI_LOG_DIR/prepare-second.log"
          sh ./start.sh --help 2>&1 | tee "$CI_LOG_DIR/launcher-help.log"
      - name: Первый и повторный запуск Windows
        if: runner.os == 'Windows'
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/start-windows.ps1 --prepare-only 2>&1 | tee "$CI_LOG_DIR/prepare-first.log"
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/start-windows.ps1 --prepare-only 2>&1 | tee "$CI_LOG_DIR/prepare-second.log"
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/start-windows.ps1 --help 2>&1 | tee "$CI_LOG_DIR/launcher-help.log"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - name: Зависимости терминального сценария
        if: runner.os == 'Linux'
        run: |
          python -m venv "$RUNNER_TEMP/harness-pty-python"
          "$RUNNER_TEMP/harness-pty-python/bin/python" -m pip install --disable-pip-version-check pyte==0.8.2 2>&1 | tee "$CI_LOG_DIR/pty-install.log"
      - name: Офлайн-проверка CLI в PTY
        if: runner.os == 'Linux'
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p .harness
          rm -f docs/playtest-source-bugs.json .harness/source-bugs-frames.json
          collect_pty() {
            for file in docs/playtest-source-bugs.json .harness/source-bugs-frames.json; do
              if [ -f "$file" ]; then cp "$file" "$CI_LOG_DIR/"; fi
            done
          }
          trap collect_pty EXIT
          "$RUNNER_TEMP/harness-pty-python/bin/python" scripts/playtest-source-bugs.py --node "$(command -v node)" 2>&1 | tee "$CI_LOG_DIR/pty.log"
      - name: Два окна, восстановление и диагностика в PTY 48×24 и 80×24
        if: runner.os == 'Linux'
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          collect_core_pty() {
            if [ -d releases/core-playtest ]; then cp -R releases/core-playtest "$CI_LOG_DIR/"; fi
          }
          trap collect_core_pty EXIT
          "$RUNNER_TEMP/harness-pty-python/bin/python" scripts/playtest-core.py --node "$(command -v node)" 2>&1 | tee "$CI_LOG_DIR/core-pty.log"
      - name: Проекты в двух PTY 48×24 и 80×24
        if: runner.os == 'Linux'
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p releases/project-playtest
          collect_project_pty() {
            cp -R releases/project-playtest "$CI_LOG_DIR/"
          }
          trap collect_project_pty EXIT
          "$RUNNER_TEMP/harness-pty-python/bin/python" scripts/playtest-projects.py --node "$(command -v node)" --output releases/project-playtest/frames.json 2>&1 | tee "$CI_LOG_DIR/projects-pty.log"
      - name: Редактор и приёмка без JSON в PTY 48×24 и 80×24
        if: runner.os == 'Linux'
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          collect_editor_pty() {
            cp -R releases/project-playtest "$CI_LOG_DIR/"
          }
          trap collect_editor_pty EXIT
          "$RUNNER_TEMP/harness-pty-python/bin/python" scripts/playtest-project-editor.py --node "$(command -v node)" --output releases/project-playtest/editor-frames.json 2>&1 | tee "$CI_LOG_DIR/project-editor-pty.log"
      - name: Логи и свежие отчёты
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-ci-${{ matrix.os }}
          path: ${{ runner.temp }}/harness-ci/
          if-no-files-found: warn
          retention-days: 7
  portable:
    name: Portable ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            nodePlatform: linux
            arch: x64
          - runner: windows-2025
            platform: windows
            nodePlatform: win32
            arch: x64
          - runner: macos-15
            platform: macos
            nodePlatform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            nodePlatform: darwin
            arch: x64
    env:
      PORTABLE_PLATFORM: ${{ matrix.nodePlatform }}
      PORTABLE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Проверка нативной платформы и архитектуры
        run: |
          PORTABLE_LOG_DIR="$RUNNER_TEMP/harness-portable-ci"
          printf 'PORTABLE_LOG_DIR=%s\n' "$PORTABLE_LOG_DIR" >> "$GITHUB_ENV"
          mkdir -p "$PORTABLE_LOG_DIR"
          node --input-type=module <<'NODE' | tee "$PORTABLE_LOG_DIR/environment.log"
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const expected = { platform: process.env.PORTABLE_PLATFORM, arch: process.env.PORTABLE_ARCH };
          console.log(JSON.stringify({ version, commit: process.env.GITHUB_SHA, node: process.version,
            platform: process.platform, arch: process.arch, runnerArch: process.env.RUNNER_ARCH, expected }, null, 2));
          if (process.platform !== expected.platform || process.arch !== expected.arch ||
              process.env.RUNNER_ARCH?.toLowerCase() !== expected.arch)
            throw new Error('Runner и Node должны иметь нативную архитектуру поставки.');
          NODE
      - name: Установка и сборка приложения
        run: |
          npm ci --include=dev --include=optional --no-audit --no-fund 2>&1 | tee "$PORTABLE_LOG_DIR/install.log"
          npm run build 2>&1 | tee "$PORTABLE_LOG_DIR/build.log"
      - name: ZIP с runtime и production-зависимостями
        run: node scripts/portable-pack.mjs 2>&1 | tee "$PORTABLE_LOG_DIR/pack.log"
      - name: Распакованная поставка без системного Node/npm и офлайн-демо
        run: node scripts/portable-check.mjs 2>&1 | tee "$PORTABLE_LOG_DIR/check.log"
      - name: Проверенный ZIP и SHA256
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-portable-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            releases/harness-*-${{ matrix.platform }}-${{ matrix.arch }}.zip
            releases/harness-*-${{ matrix.platform }}-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Подробные журналы упаковки и проверки
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/harness-portable-ci"
          for file in releases/portable-pack-*.log releases/portable-check-*.json releases/portable-check-*.log; do
            if [ -f "$file" ]; then cp "$file" "$RUNNER_TEMP/harness-portable-ci/"; fi
          done
      - name: Диагностика нативной поставки
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-portable-ci-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/harness-portable-ci/
          if-no-files-found: warn
          retention-days: 7
  project-diff:
    name: Project diff and demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Подготовка стенда
        run: |
          npm ci
          npm run build
          python -m venv "$RUNNER_TEMP/harness-pty-python"
          "$RUNNER_TEMP/harness-pty-python/bin/python" -m pip install --disable-pip-version-check pyte==0.8.2
          mkdir -p releases/project-playtest
      - name: Меню 10 000 задач при параллельном сравнении
        run: npm run benchmark:diff -- 10000 releases/project-playtest/diff-benchmark.json
      - name: Изменения, демо и выход в настоящем PTY
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          "$RUNNER_TEMP/harness-pty-python/bin/python" scripts/playtest-project-diff.py --node "$(command -v node)" --output releases/project-playtest/diff-frames.json
          "$RUNNER_TEMP/harness-pty-python/bin/python" scripts/playtest-demo.py --node "$(command -v node)" --output releases/project-playtest/demo-frames.json
          "$RUNNER_TEMP/harness-pty-python/bin/python" scripts/playtest-demo-signals.py --node "$(command -v node)" --output releases/project-playtest/demo-signals.json
      - name: Живой индикатор работы в двух PTY 48×24 и 80×24
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          "$RUNNER_TEMP/harness-pty-python/bin/python" scripts/playtest-work-indicator-pty.py --node "$(command -v node)" --output releases/project-playtest/work-indicator-frames.json 2>&1 | tee releases/project-playtest/work-indicator.log
      - name: Кадры и результаты стенда
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-project-diff
          path: releases/project-playtest/
          if-no-files-found: warn
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Сборка проверочного образа
        run: |
          CI_LOG_DIR="$RUNNER_TEMP/harness-ci"
          printf 'CI_LOG_DIR=%s\n' "$CI_LOG_DIR" >> "$GITHUB_ENV"
          mkdir -p "$CI_LOG_DIR"
          docker build --progress=plain -f Dockerfile.test -t harness-ci:test . 2>&1 | tee "$CI_LOG_DIR/docker-build.log"
      - name: Проверка образа без внешней сети
        run: docker run --rm --network none harness-ci:test 2>&1 | tee "$CI_LOG_DIR/docker-check.log"
      - name: Логи контейнера
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-ci-docker
          path: ${{ runner.temp }}/harness-ci/
          if-no-files-found: warn
          retention-days: 7
